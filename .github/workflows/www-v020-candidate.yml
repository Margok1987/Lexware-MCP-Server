name: WWW v0.2.0 candidate

on:
  push:
    branches:
      - www-v0.2.0-ci

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: 9bd9b3cfda96420e37e8b751b4a9469c330c39cb

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build immutable candidate image
        run: docker build -t lexware-mcp:0.2.0-www-9bd9b3c .

      - name: Runtime and auth canary
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name lexware-mcp-canary \
            -p 127.0.0.1:18080:8080 \
            -e LEXWARE_API_KEY=dummy \
            -e MCP_AUTH_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e LEXWARE_ENABLE_DRAFTS=true \
            -e LEXWARE_ENABLE_FINALIZE=false \
            -e LEXWARE_ENABLE_URL_UPLOAD=false \
            lexware-mcp:0.2.0-www-9bd9b3c
          trap 'docker rm -f lexware-mcp-canary >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/status | grep -q '"status":"ok"'; then
              break
            fi
            sleep 1
          done

          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/status)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json, text/event-stream' http://127.0.0.1:18080/mcp)" = "401"
          test "$(docker inspect --format='{{.State.Status}}' lexware-mcp-canary)" = "running"

      - name: Export image
        run: |
          docker image inspect lexware-mcp:0.2.0-www-9bd9b3c --format='{{.Id}}' > lexware-mcp-image-id.txt
          docker save lexware-mcp:0.2.0-www-9bd9b3c -o lexware-mcp-0.2.0-www-9bd9b3c.tar
          sha256sum lexware-mcp-0.2.0-www-9bd9b3c.tar > lexware-mcp-0.2.0-www-9bd9b3c.tar.sha256

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexware-mcp-0.2.0-www-9bd9b3c
          path: |
            lexware-mcp-0.2.0-www-9bd9b3c.tar
            lexware-mcp-0.2.0-www-9bd9b3c.tar.sha256
            lexware-mcp-image-id.txt
          if-no-files-found: error
          retention-days: 7
